<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Institucional - Biblioteca</title>
    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Vue.js 3 Global -->
    <script src="https://cdn.jsdelivr.net/npm/vue@3.3.4/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    
    <style>
        [v-cloak] { display: none; }
        body {
            background-color: #f8f9fa;
            background-image: radial-gradient(circle at 100% 100%, rgba(13,110,253,0.05) 0, transparent 50%), 
                              radial-gradient(circle at 0 0, rgba(13,110,253,0.05) 0, transparent 50%);
        }
        .card-login {
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>

<div id="login-app" v-cloak class="container min-vh-100 d-flex flex-column align-items-center justify-content-center py-5">
    
    <div class="text-center mb-5">
        <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center shadow-lg mb-3" style="width: 80px; height: 80px;">
            <i class="bi bi-book-half display-4"></i>
        </div>
        <h2 class="fw-bold text-primary-emphasis mb-1">BIBLIOTECA INSTITUCIONAL</h2>
        <p class="text-muted">Desarrollo B2B2C - Acceso Seguro</p>
    </div>

    <!-- PASO 1: SELECCIÓN DE ROL -->
    <div v-if="vistaActual === 'seleccion'" class="card card-login shadow-lg border-0 rounded-4 p-4 p-sm-5 w-100" style="max-width: 500px;">
        <h4 class="text-center fw-bold mb-4 text-secondary">¿Cómo deseas ingresar?</h4>
        
        <div class="d-grid gap-3">
            <button @click="seleccionarVista('lector')" class="btn btn-outline-primary btn-lg p-4 d-flex align-items-center justify-content-center gap-3 fw-bold shadow-sm rounded-3">
                <i class="bi bi-person-badge fs-3"></i>
                <span>Soy Lector (Estudiante)</span>
            </button>
            
            <button @click="seleccionarVista('admin')" class="btn btn-outline-dark btn-lg p-4 d-flex align-items-center justify-content-center gap-3 fw-bold shadow-sm rounded-3">
                <i class="bi bi-shield-lock-fill fs-3 text-secondary"></i>
                <span>Soy Administrador</span>
            </button>
        </div>
    </div>

    <!-- PASO 2: FORMULARIO LECTOR -->
    <div v-else-if="vistaActual === 'lector'" class="card card-login shadow-lg border-0 rounded-4 p-4 p-sm-5 w-100" style="max-width: 450px;">
        <div class="d-flex align-items-center mb-4 pb-3 border-bottom">
            <button @click="vistaActual = 'seleccion'" class="btn btn-light rounded-circle shadow-sm me-3" title="Volver">
                <i class="bi bi-arrow-left"></i>
            </button>
            <h5 class="fw-bold mb-0 text-primary"><i class="bi bi-person-badge me-2"></i>Acceso Estudiantes</h5>
        </div>

        <form @submit.prevent="iniciarSesion('lector')">
            <div class="mb-4">
                <label class="form-label small fw-bold text-secondary text-uppercase">Correo Institucional</label>
                <div class="input-group">
                    <span class="input-group-text bg-body-secondary border-0"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control form-control-lg bg-body-tertiary border-0 shadow-none focus-ring" v-model="formLector.email" required placeholder="alumno@institucion.edu">
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label small fw-bold text-secondary text-uppercase">Contraseña de Portal</label>
                <div class="input-group">
                    <span class="input-group-text bg-body-secondary border-0"><i class="bi bi-key"></i></span>
                    <input type="password" class="form-control form-control-lg bg-body-tertiary border-0 shadow-none focus-ring" v-model="formLector.password" required placeholder="••••••••">
                </div>
            </div>

            <div v-if="errorLogin" class="alert alert-danger py-2 small mb-4 shadow-sm border-0"><i class="bi bi-exclamation-circle me-1"></i> {{ errorLogin }}</div>

            <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow mt-2" :disabled="isCargando">
                <span v-if="isCargando" class="spinner-border spinner-border-sm me-2"></span>
                Ingresar al Estante
            </button>
        </form>
    </div>

    <!-- PASO 2: FORMULARIO ADMINISTRADOR -->
    <div v-else-if="vistaActual === 'admin'" class="card card-login shadow-lg border-0 rounded-4 p-4 p-sm-5 w-100" style="max-width: 450px;">
        <div class="d-flex align-items-center mb-4 pb-3 border-bottom">
            <button @click="vistaActual = 'seleccion'" class="btn btn-light rounded-circle shadow-sm me-3" title="Volver">
                <i class="bi bi-arrow-left"></i>
            </button>
            <h5 class="fw-bold mb-0 text-dark"><i class="bi bi-shield-lock-fill me-2 text-primary"></i>Panel Máster Central</h5>
        </div>

        <form @submit.prevent="iniciarSesion('admin')">
            <div class="mb-4">
                <label class="form-label small fw-bold text-secondary text-uppercase">Usuario Admin</label>
                <div class="input-group">
                    <span class="input-group-text bg-body-secondary border-0"><i class="bi bi-person-fill-lock"></i></span>
                    <input type="text" class="form-control form-control-lg bg-body-tertiary border-0 shadow-none focus-ring" v-model="formAdmin.usuario" required placeholder="Código Ejecutivo...">
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label small fw-bold text-secondary text-uppercase">Contraseña Master</label>
                <div class="input-group">
                    <span class="input-group-text bg-danger bg-opacity-10 text-danger border-0"><i class="bi bi-shield-check"></i></span>
                    <input type="password" class="form-control form-control-lg bg-body-tertiary border-0 shadow-none focus-ring" v-model="formAdmin.password" required placeholder="Clave de seguridad...">
                </div>
            </div>

            <div v-if="errorLogin" class="alert alert-danger py-2 small mb-4 shadow-sm border-0"><i class="bi bi-exclamation-circle me-1"></i> {{ errorLogin }}</div>

            <button type="submit" class="btn btn-dark btn-lg w-100 fw-bold shadow mt-2" :disabled="isCargando">
                <span v-if="isCargando" class="spinner-border spinner-border-sm me-2"></span>
                Autenticar Sistema
            </button>
        </form>
    </div>

</div>

<script>
    const { createApp, ref } = Vue;

    createApp({
        setup() {
            // Estado y Módulo B2B2C
            const vistaActual = ref('seleccion'); // 'seleccion', 'lector', 'admin'
            const isCargando = ref(false);
            const errorLogin = ref('');

            // Modelos de datos estrcitamente separados
            const formLector = ref({ email: '', password: '' });
            const formAdmin = ref({ usuario: '', password: '' });

            const seleccionarVista = (vista) => {
                errorLogin.value = '';
                formLector.value = { email: '', password: '' };
                formAdmin.value = { usuario: '', password: '' };
                vistaActual.value = vista;
            };

            const iniciarSesion = async (tipo) => {
                isCargando.value = true;
                errorLogin.value = '';

                // Determinar el payload lógico
                const peticion = tipo === 'admin' 
                    ? { tipo: 'admin', documento: formAdmin.value.usuario, password: formAdmin.value.password }
                    : { tipo: 'lector', email: formLector.value.email, password: formLector.value.password };

                try {
                    const response = await axios.post('api/auth.php', peticion);
                    if (response.data.success) {
                        // Guardar datos en frontend (Redireccion al SPA Principal)
                        localStorage.setItem('user', JSON.stringify(response.data.usuario));
                        
                        // Redirigir al proyecto principal Vue Router, usando hash para forzar la recarga del estado
                        window.location.href = `index.html#/${response.data.rol === 'admin' ? 'admin/dashboard' : 'inicio/estante'}`;
                    }
                } catch (error) {
                    errorLogin.value = error.response?.data?.error || 'Error de conexión con el directorio activo.';
                } finally {
                    isCargando.value = false;
                }
            };

            return {
                vistaActual,
                isCargando,
                errorLogin,
                formLector,
                formAdmin,
                seleccionarVista,
                iniciarSesion
            };
        }
    }).mount('#login-app');
</script>
</body>
</html>
